<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labsastrabudi UBT - Book Generator Pro</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body { background-color: #f3f4f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .book-page { background: #fff; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); padding: 2rem; min-height: 297mm; width: 100%; max-width: 210mm; margin: 0 auto; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { color: #6b7280; }
        .tab-inactive:hover { color: #374151; }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        .toast-exit { animation: slideOut 0.3s ease-in forwards; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            // Form States
            const [bookType, setBookType] = useState('Fiksi');
            const [topic, setTopic] = useState('');
            const [authorName, setAuthorName] = useState('');
            const [publisherName, setPublisherName] = useState('Labsastrabudi UBT Press');
            const [aiSource, setAiSource] = useState('Gemini Canvas AI');
            const [useHumanizer, setUseHumanizer] = useState(false);
            
            // App & Data States
            const [isGenerating, setIsGenerating] = useState(false);
            const [loadingStep, setLoadingStep] = useState('');
            const [bookData, setBookData] = useState(null);
            const [coverImage, setCoverImage] = useState(null);
            const [activeTab, setActiveTab] = useState('cover');
            
            // Editor & Citation States
            const [editingChapterIndex, setEditingChapterIndex] = useState(null);
            const [editContent, setEditContent] = useState("");
            const [showCitationModal, setShowCitationModal] = useState(false);
            const [citationForm, setCitationForm] = useState({ author: '', year: '', title: '' });
            const textareaRef = useRef(null);

            // Notification State
            const [toast, setToast] = useState({ show: false, message: '', type: 'info' });

            const showNotification = (message, type = 'info') => {
                setToast({ show: true, message, type });
                setTimeout(() => setToast({ show: false, message: '', type: 'info' }), 4000);
            };

            const generateBookContent = async () => {
                if (!topic || !authorName) {
                    showNotification("Harap isi topik dan nama penulis!", "error");
                    return;
                }

                setIsGenerating(true);
                setBookData(null);
                setCoverImage(null);
                setActiveTab('cover');
                
                try {
                    setLoadingStep(`Menghubungkan ke engine ${aiSource}... merancang struktur...`);
                    
                    // Inject Persona
                    let aiPersona = "";
                    switch(aiSource) {
                        case 'Claude Anthropic': aiPersona = "Bertindaklah sebagai Claude dari Anthropic, AI dengan gaya bahasa sangat bernuansa, empatik, kaya kosa kata, dan detail."; break;
                        case 'DeepSeek': aiPersona = "Bertindaklah sebagai DeepSeek, AI dengan kedalaman analitis, logika terstruktur, efisiensi informasi, dan gaya bahasa teknis/lugas."; break;
                        case 'ChatGPT': aiPersona = "Bertindaklah sebagai ChatGPT, komunikatif, luwes, dan sangat adaptif dalam gaya penceritaan populer."; break;
                        case 'Copilot': aiPersona = "Bertindaklah sebagai Microsoft Copilot, profesional, sintesis ide brilian, dan efisiensi kalimat."; break;
                        case 'Consensus': aiPersona = "Bertindaklah sebagai Consensus, kaku pada kaidah akademis, berbasis bukti empiris, nada saintifik murni."; break;
                        default: aiPersona = "Bertindaklah sebagai Gemini Canvas AI, model bahasa tingkat lanjut dengan kreativitas spasial tinggi."; break;
                    }

                    // Inject Humanizer
                    let humanizerPrompt = useHumanizer ? 
                        "\nINSTRUKSI KRITIS (HUMANIZER AKTIF): Tulis seluruh teks bab dengan gaya bahasa 100% natural menyerupai manusia untuk MENGHINDARI DETEKSI AI (Turnitin/ZeroGPT). Hindari struktur repetitif dan kata khas AI ('selanjutnya', 'kesimpulannya'). Gunakan variasi panjang kalimat, burstiness/perplexity tinggi, idiom lokal, dan nada organik." : 
                        "";

                    const prompt = `${aiPersona} ${humanizerPrompt}
                    Buatlah draf lengkap (kerangka dan isi) untuk buku ${bookType} dengan topik/tema "${topic}". 
                    Penulis: ${authorName}, Penerbit: ${publisherName}.
                    Hasilkan output dalam format JSON murni. Pastikan array chapters memiliki minimal 3 bab dengan konten yang cukup panjang.
                    Gunakan skema JSON berikut:
                    {
                        "title": "Judul Buku",
                        "synopsis": "Sinopsis untuk cover belakang",
                        "endorsements": ["Endorsement 1", "Endorsement 2"],
                        "kdt": {
                            "title": "Judul", "author": "Penulis", "isbn": "978-623-XXX-X", "publisher": "Penerbit", "year": "2026", "dimensions": "14 x 21 cm"
                        },
                        "preface": "Isi kata pengantar...",
                        "chapters": [
                            {
                                "title": "Judul Bab 1",
                                "outline": ["Sub-bab 1.1", "Sub-bab 1.2"],
                                "content": "Isi lengkap bab 1 berupa beberapa paragraf..."
                            }
                        ],
                        "bibliography": [
                            {"author": "Nama Pengarang", "year": "Tahun", "title": "Judul Referensi"}
                        ],
                        "index": [
                            {"keyword": "Kata Kunci", "chapters": ["Bab 1", "Bab 2"]}
                        ],
                        "author_bio": "Biografi singkat penulis"
                    }`;

                    const payload = {
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    };

                    const apiKey = ""; // Disuntikkan otomatis oleh sistem Canvas
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    
                    if (result.candidates && result.candidates[0].content.parts[0].text) {
                        let jsonText = result.candidates[0].content.parts[0].text;
                        // Bersihkan backticks jika masih terbawa
                        jsonText = jsonText.replace(/```json/g, '').replace(/```/g, '');
                        const parsedData = JSON.parse(jsonText);
                        
                        setBookData(parsedData);
                        setLoadingStep('Mendesain cover buku berdasarkan konten...');
                        await generateCoverImage(parsedData.title, parsedData.synopsis);
                    } else {
                        throw new Error("Format respons API tidak sesuai.");
                    }
                } catch (error) {
                    console.error("Error generating book:", error);
                    showNotification("Gagal menghasilkan buku. Silakan coba lagi.", "error");
                    setIsGenerating(false);
                }
            };

            const generateCoverImage = async (title, synopsis) => {
                try {
                    let imageStyle = "";
                    switch(aiSource) {
                        case 'Claude Anthropic': imageStyle = "soft, nuanced, highly detailed, artistic"; break;
                        case 'DeepSeek': imageStyle = "structural, precise, geometric, high-tech"; break;
                        case 'ChatGPT': imageStyle = "vibrant, mainstream, highly engaging"; break;
                        case 'Copilot': imageStyle = "corporate, sleek, professional, modern"; break;
                        case 'Consensus': imageStyle = "academic, minimalist, informative, data-driven"; break;
                        default: imageStyle = "creative, stunning, advanced concept art"; break;
                    }

                    const imagePrompt = `A minimal, elegant, and professional book cover background art for a ${bookType} book titled "${title}". The theme is about: ${synopsis.substring(0, 100)}. Stylistic influence: ${imageStyle}. NO TEXT on the image. High quality, 4k, suitable for traditional publishing. Aspect ratio 3:4.`;

                    const payload = {
                        instances: { prompt: imagePrompt },
                        parameters: { sampleCount: 1 }
                    };

                    const apiKey = ""; 
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const result = await response.json();
                    if (result.predictions && result.predictions.length > 0) {
                        setCoverImage(`data:image/png;base64,${result.predictions[0].bytesBase64Encoded}`);
                    }
                } catch (error) {
                    console.error("Error generating cover image:", error);
                    showNotification("Gagal menghasilkan cover. Gambar default digunakan.", "error");
                } finally {
                    setIsGenerating(false);
                    showNotification("Buku berhasil di-generate!", "success");
                }
            };

            const exportToWord = () => {
                if (!bookData) return;
                
                showNotification("Mempersiapkan dokumen Word...", "info");
                
                const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>${bookData.title}</title><style>body { font-family: 'Times New Roman', serif; font-size: 12pt; line-height: 1.5; } h1, h2 { text-align: center; } .page-break { page-break-before: always; }</style></head><body>`;
                const footer = "</body></html>";
                const pageBreak = "<br clear='all' style='page-break-before:always' class='page-break' />";
                
                let contentHTML = "";
                
                // Judul
                contentHTML += `<div style="text-align: center; margin-top: 100px;">
                    <h1 style="font-size: 24pt; font-weight: bold;">${bookData.title}</h1>
                    <p style="font-size: 14pt; margin-top: 50px;">Oleh: ${authorName}</p>
                    <p style="font-size: 14pt; margin-top: 20px;">Penerbit: ${publisherName}</p>
                </div>${pageBreak}`;
                
                // KDT
                contentHTML += `<h2>Katalog Dalam Terbitan (KDT)</h2>
                    <p><b>Judul:</b> ${bookData.kdt.title}</p>
                    <p><b>Penulis:</b> ${bookData.kdt.author}</p>
                    <p><b>ISBN:</b> ${bookData.kdt.isbn}</p>
                    <p><b>Penerbit:</b> ${bookData.kdt.publisher}, ${bookData.kdt.year}</p>
                    <p><b>Hak Cipta dilindungi undang-undang.</b></p>${pageBreak}`;
                
                // Pengantar
                contentHTML += `<h2>Kata Pengantar</h2><p>${bookData.preface.replace(/\n/g, '<br/>')}</p>${pageBreak}`;
                
                // Bab
                bookData.chapters.forEach((ch, idx) => {
                    contentHTML += `<h2>Bab ${idx + 1}: ${ch.title}</h2>`;
                    contentHTML += `<h3>Outline:</h3><ul>${ch.outline.map(o => `<li>${o}</li>`).join('')}</ul>`;
                    contentHTML += `<p>${ch.content.replace(/\n/g, '<br/>')}</p>${pageBreak}`;
                });
                
                // Daftar Pustaka
                contentHTML += `<h2>Daftar Pustaka</h2><ul>`;
                bookData.bibliography.forEach(bib => {
                    contentHTML += `<li>${bib.author}. (${bib.year}). <i>${bib.title}</i>.</li>`;
                });
                contentHTML += `</ul>${pageBreak}`;
                
                // Sinopsis & Penulis
                contentHTML += `<h2>Profil Penulis</h2><p>${bookData.author_bio}</p><br/>
                    <h2>Sinopsis</h2><p>${bookData.synopsis}</p>`;

                const sourceHTML = header + contentHTML + footer;
                const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
                
                const fileDownload = document.createElement("a");
                document.body.appendChild(fileDownload);
                fileDownload.href = source;
                fileDownload.download = `${bookData.title.replace(/ /g, '_')}_Draft.doc`;
                fileDownload.click();
                document.body.removeChild(fileDownload);
            };

            const handleEditChapter = (index) => {
                setEditingChapterIndex(index);
                setEditContent(bookData.chapters[index].content);
            };

            const handleSaveEdit = () => {
                const updatedChapters = [...bookData.chapters];
                updatedChapters[editingChapterIndex].content = editContent;
                
                // Auto-Indexing Logic: Ekstrak kata dengan huruf kapital (kecuali di awal kalimat, disederhanakan)
                const words = editContent.match(/\b[A-Z][a-z]+\b/g) || [];
                const ignoreWords = ['Di', 'Ke', 'Dari', 'Yang', 'Dan', 'Atau', 'Pada', 'Dalam', 'Untuk'];
                const potentialKeywords = [...new Set(words.filter(w => !ignoreWords.includes(w) && w.length > 3))];
                
                let updatedIndex = [...bookData.index];
                const chapterName = `Bab ${editingChapterIndex + 1}`;
                
                potentialKeywords.forEach(kw => {
                    const existingEntry = updatedIndex.find(i => i.keyword === kw);
                    if (existingEntry) {
                        if (!existingEntry.chapters.includes(chapterName)) {
                            existingEntry.chapters.push(chapterName);
                        }
                    } else {
                        updatedIndex.push({ keyword: kw, chapters: [chapterName] });
                    }
                });

                setBookData({
                    ...bookData, 
                    chapters: updatedChapters,
                    index: updatedIndex
                });
                setEditingChapterIndex(null);
                showNotification("Perubahan disimpan & Indeks diperbarui!", "success");
            };

            const insertCitation = () => {
                if (!citationForm.author || !citationForm.year || !citationForm.title) {
                    showNotification("Lengkapi form kutipan!", "error");
                    return;
                }
                
                const citationText = ` (${citationForm.author}, ${citationForm.year})`;
                
                // Insert at cursor position if possible, else append
                if (textareaRef.current) {
                    const startPos = textareaRef.current.selectionStart;
                    const endPos = textareaRef.current.selectionEnd;
                    const newContent = editContent.substring(0, startPos) + citationText + editContent.substring(endPos);
                    setEditContent(newContent);
                } else {
                    setEditContent(editContent + citationText);
                }
                
                // Tambahkan ke Daftar Pustaka
                const updatedBib = [...bookData.bibliography, {
                    author: citationForm.author,
                    year: citationForm.year,
                    title: citationForm.title
                }];
                
                setBookData({...bookData, bibliography: updatedBib});
                setShowCitationModal(false);
                setCitationForm({ author: '', year: '', title: '' });
                showNotification("Kutipan ditambahkan!", "success");
            };

            return (
                <div className="min-h-screen flex flex-col h-screen overflow-hidden">
                    {/* Header */}
                    <header className="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center z-10">
                        <div className="flex items-center gap-3">
                            <i className="fas fa-book-open text-2xl"></i>
                            <div>
                                <h1 className="text-xl font-bold leading-tight">Labsastrabudi UBT</h1>
                                <p className="text-xs text-blue-300">Book Generator Pro (Perpusnas ISBN Ready)</p>
                            </div>
                        </div>
                        <div className="text-sm font-medium bg-blue-800 px-3 py-1 rounded-full border border-blue-700">
                            v2.5 <i className="fas fa-bolt text-yellow-400 ml-1"></i>
                        </div>
                    </header>

                    <div className="flex flex-1 overflow-hidden">
                        {/* Sidebar */}
                        <div className="w-80 bg-white border-r border-gray-200 flex flex-col overflow-y-auto">
                            <div className="p-5 space-y-4">
                                <h2 className="font-bold text-gray-800 border-b pb-2">Konfigurasi Buku</h2>
                                
                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-1">Jenis Buku</label>
                                    <select value={bookType} onChange={(e) => setBookType(e.target.value)} className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                                        <option value="Fiksi">Buku Fiksi / Novel</option>
                                        <option value="Non-Fiksi">Buku Non-Fiksi / Ilmiah</option>
                                        <option value="Ajar">Buku Ajar Akademik</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-1">Topik Utama / Ide Cerita</label>
                                    <textarea value={topic} onChange={(e) => setTopic(e.target.value)} placeholder="Contoh: Petualangan ke Mars mencari sumber air..." rows="3" className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                                </div>

                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-1">Nama Penulis</label>
                                    <input type="text" value={authorName} onChange={(e) => setAuthorName(e.target.value)} className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                                </div>

                                <div>
                                    <label className="block text-sm font-semibold text-gray-700 mb-1">Nama Penerbit</label>
                                    <input type="text" value={publisherName} onChange={(e) => setPublisherName(e.target.value)} className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                                </div>

                                {/* Pilihan AI & Humanizer */}
                                <div className="pt-3 border-t border-gray-200">
                                    <label className="block text-sm font-semibold text-gray-700 mb-1 flex items-center gap-2">
                                        <i className="fas fa-microchip text-blue-600"></i> Sumber AI Engine
                                    </label>
                                    <select value={aiSource} onChange={(e) => setAiSource(e.target.value)} className="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-blue-50 text-blue-900 font-medium">
                                        <option value="Gemini Canvas AI">Gemini Canvas AI (Default)</option>
                                        <option value="Claude Anthropic">Claude Anthropic (Nuanced)</option>
                                        <option value="DeepSeek">DeepSeek (Logical)</option>
                                        <option value="ChatGPT">ChatGPT (Popular)</option>
                                        <option value="Copilot">Copilot (Professional)</option>
                                        <option value="Consensus">Consensus (Akademik)</option>
                                    </select>
                                </div>

                                <div className="flex items-start gap-3 mt-2 bg-yellow-50 p-3 rounded-lg border border-yellow-200">
                                    <input type="checkbox" id="humanizer" checked={useHumanizer} onChange={(e) => setUseHumanizer(e.target.checked)} className="w-5 h-5 mt-0.5 text-yellow-600 rounded cursor-pointer" />
                                    <label htmlFor="humanizer" className="text-sm font-semibold text-yellow-900 cursor-pointer">
                                        Aktifkan Humanizer
                                        <span className="block text-xs font-normal mt-1 text-yellow-700">Meningkatkan burstiness & perplexity agar tulisan lolos deteksi AI (Turnitin/GPTZero).</span>
                                    </label>
                                </div>
                            </div>
                            
                            <div className="p-5 mt-auto bg-gray-50 border-t space-y-3">
                                <button 
                                    onClick={generateBookContent} 
                                    disabled={isGenerating}
                                    className={`w-full py-3 px-4 rounded-lg font-bold text-white shadow-md transition-all flex items-center justify-center gap-2 ${isGenerating ? 'bg-blue-400 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700 active:scale-95'}`}
                                >
                                    {isGenerating ? <i className="fas fa-spinner fa-spin"></i> : <i className="fas fa-magic"></i>}
                                    {isGenerating ? 'Memproses...' : 'Generate Buku'}
                                </button>

                                {bookData && !isGenerating && (
                                    <button 
                                        onClick={exportToWord}
                                        className="w-full py-2.5 px-4 rounded-lg font-bold text-green-800 bg-green-100 hover:bg-green-200 border border-green-300 transition-all flex items-center justify-center gap-2"
                                    >
                                        <i className="fas fa-file-word"></i>
                                        Unduh Naskah (.doc)
                                    </button>
                                )}
                            </div>
                        </div>

                        {/* Main Content Area */}
                        <div className="flex-1 bg-gray-200 overflow-y-auto relative flex flex-col">
                            {isGenerating && (
                                <div className="absolute inset-0 bg-white/80 backdrop-blur-sm z-20 flex flex-col items-center justify-center">
                                    <i className="fas fa-circle-notch fa-spin text-5xl text-blue-600 mb-4"></i>
                                    <h3 className="text-xl font-bold text-gray-800 mb-2">Merangkai Buku...</h3>
                                    <p className="text-gray-600 font-medium">{loadingStep}</p>
                                    <div className="w-64 bg-gray-200 rounded-full h-2 mt-4 overflow-hidden">
                                        <div className="bg-blue-600 h-2 rounded-full w-full animate-pulse"></div>
                                    </div>
                                </div>
                            )}

                            {/* Tabs Header */}
                            {bookData && !isGenerating && (
                                <div className="bg-white shadow-sm px-4 pt-4 border-b flex gap-1 overflow-x-auto shrink-0">
                                    {[
                                        { id: 'cover', label: 'Cover Depan & Belakang', icon: 'fa-image' },
                                        { id: 'kdt', label: 'Halaman Hak Cipta (KDT)', icon: 'fa-copyright' },
                                        { id: 'preface', label: 'Pengantar & Daftar Isi', icon: 'fa-list' },
                                        { id: 'chapters', label: 'Isi Buku (Per-Bab)', icon: 'fa-file-alt' },
                                        { id: 'end', label: 'Daftar Pustaka & Indeks', icon: 'fa-bookmark' },
                                    ].map(t => (
                                        <button 
                                            key={t.id}
                                            onClick={() => setActiveTab(t.id)}
                                            className={`px-4 py-2 text-sm whitespace-nowrap flex items-center gap-2 rounded-t-lg transition-colors ${activeTab === t.id ? 'tab-active bg-blue-50/50' : 'tab-inactive hover:bg-gray-50'}`}
                                        >
                                            <i className={`fas ${t.icon}`}></i> {t.label}
                                        </button>
                                    ))}
                                </div>
                            )}

                            {/* Preview Panel */}
                            <div className="p-8 flex-1 overflow-y-auto">
                                {!bookData && !isGenerating && (
                                    <div className="h-full flex flex-col items-center justify-center text-gray-400">
                                        <i className="fas fa-book-open text-6xl mb-4 text-gray-300"></i>
                                        <p className="text-lg">Silakan isi formulir dan klik "Generate Buku" untuk memulai.</p>
                                    </div>
                                )}

                                {bookData && !isGenerating && (
                                    <div className="space-y-8">
                                        
                                        {activeTab === 'cover' && (
                                            <div className="flex gap-8 justify-center flex-wrap">
                                                {/* Cover Depan */}
                                                <div className="book-page flex flex-col relative overflow-hidden" style={{ width: '148mm', height: '210mm', padding: 0 }}>
                                                    {coverImage ? (
                                                        <img src={coverImage} alt="Cover" className="absolute inset-0 w-full h-full object-cover z-0 opacity-80" />
                                                    ) : (
                                                        <div className="absolute inset-0 bg-gradient-to-br from-blue-900 to-indigo-800 z-0"></div>
                                                    )}
                                                    <div className="relative z-10 flex flex-col h-full p-8 text-white">
                                                        <div className="mt-16 text-center">
                                                            <h1 className="text-4xl font-extrabold uppercase tracking-wider drop-shadow-lg leading-tight">{bookData.title}</h1>
                                                            <div className="w-16 h-1 bg-white mx-auto my-6 opacity-50"></div>
                                                            <p className="text-xl font-light tracking-widest uppercase drop-shadow-md">{bookType}</p>
                                                        </div>
                                                        <div className="mt-auto text-center pb-8">
                                                            <p className="text-2xl font-bold uppercase drop-shadow-lg">{authorName}</p>
                                                            <p className="text-sm uppercase tracking-widest mt-2 opacity-80">{publisherName}</p>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* Cover Belakang */}
                                                <div className="book-page flex flex-col" style={{ width: '148mm', height: '210mm' }}>
                                                    <div className="flex-1">
                                                        <h3 className="font-bold text-xl mb-4 border-b pb-2">SINOPSIS</h3>
                                                        <p className="text-gray-700 italic text-justify leading-relaxed">{bookData.synopsis}</p>
                                                        
                                                        <h3 className="font-bold text-lg mt-6 mb-3 border-b pb-1">ENDORSEMENT</h3>
                                                        <div className="space-y-3">
                                                            {bookData.endorsements.map((end, idx) => (
                                                                <p key={idx} className="text-sm text-gray-600 bg-gray-50 p-3 rounded border-l-4 border-blue-500">"{end}"</p>
                                                            ))}
                                                        </div>
                                                    </div>
                                                    <div className="mt-8 pt-4 border-t border-gray-200 flex justify-between items-end">
                                                        <div className="text-sm text-gray-500">
                                                            <p className="font-bold text-black">{publisherName}</p>
                                                            <p>Penerbitan Independen</p>
                                                        </div>
                                                        <div className="w-24 h-12 bg-white border-2 border-black flex items-center justify-center font-mono text-xs font-bold">
                                                            ||||||||||||||<br/>ISBN {bookData.kdt.isbn.substring(8)}
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {activeTab === 'kdt' && (
                                            <div className="book-page flex flex-col justify-center text-sm">
                                                <h2 className="text-center font-bold text-lg mb-8 uppercase">Undang-Undang Republik Indonesia Nomor 28 Tahun 2014 Tentang Hak Cipta</h2>
                                                <p className="text-justify mb-8 text-gray-600">Hak Cipta dilindungi undang-undang. Dilarang mengutip atau memperbanyak sebagian atau seluruh isi buku ini tanpa izin tertulis dari Penerbit.</p>
                                                
                                                <div className="border border-black p-6 mx-auto w-4/5 text-xs font-mono bg-yellow-50/30">
                                                    <h3 className="font-bold mb-4 border-b border-black pb-1">Katalog Dalam Terbitan (KDT)</h3>
                                                    <table className="w-full">
                                                        <tbody>
                                                            <tr><td className="w-24 align-top">Penulis</td><td className="w-4">:</td><td>{bookData.kdt.author}</td></tr>
                                                            <tr><td className="align-top">Judul</td><td>:</td><td className="font-bold">{bookData.kdt.title}</td></tr>
                                                            <tr><td className="align-top">Penerbit</td><td>:</td><td>{bookData.kdt.publisher}</td></tr>
                                                            <tr><td className="align-top">Tahun</td><td>:</td><td>{bookData.kdt.year}</td></tr>
                                                            <tr><td className="align-top">Ukuran</td><td>:</td><td>{bookData.kdt.dimensions}</td></tr>
                                                            <tr><td className="align-top pt-4 font-bold">ISBN</td><td className="pt-4">:</td><td className="pt-4 font-bold text-lg">{bookData.kdt.isbn}</td></tr>
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        )}

                                        {activeTab === 'preface' && (
                                            <div className="book-page flex flex-col gap-16">
                                                <div>
                                                    <h2 className="text-2xl font-bold text-center mb-8 uppercase tracking-widest">Kata Pengantar</h2>
                                                    <div className="text-justify leading-relaxed whitespace-pre-wrap text-gray-800 indent-8">
                                                        {bookData.preface}
                                                    </div>
                                                    <div className="mt-8 text-right">
                                                        <p>Penulis,</p>
                                                        <br/><br/>
                                                        <p className="font-bold">{authorName}</p>
                                                    </div>
                                                </div>
                                                
                                                <div style={{ pageBreakBefore: 'always' }}>
                                                    <h2 className="text-2xl font-bold text-center mb-8 uppercase tracking-widest border-b-2 border-black pb-4">Daftar Isi</h2>
                                                    <div className="space-y-4 max-w-lg mx-auto">
                                                        <div className="flex justify-between items-end border-b border-dotted border-gray-300 pb-1"><span>KATA PENGANTAR</span><span>i</span></div>
                                                        <div className="flex justify-between items-end border-b border-dotted border-gray-300 pb-1"><span>DAFTAR ISI</span><span>ii</span></div>
                                                        {bookData.chapters.map((ch, idx) => (
                                                            <div key={idx}>
                                                                <div className="flex justify-between items-end font-bold mt-3 border-b border-dotted border-gray-400 pb-1">
                                                                    <span>BAB {idx + 1} - {ch.title.toUpperCase()}</span>
                                                                    <span>{idx * 10 + 1}</span>
                                                                </div>
                                                                {ch.outline.map((sub, sidx) => (
                                                                    <div key={sidx} className="flex justify-between items-end pl-4 text-sm text-gray-700 mt-2 border-b border-dotted border-gray-200 pb-1">
                                                                        <span>1.{sidx+1}. {sub}</span>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        ))}
                                                        <div className="flex justify-between items-end font-bold mt-4 border-b border-dotted border-gray-400 pb-1"><span>DAFTAR PUSTAKA</span><span>...</span></div>
                                                        <div className="flex justify-between items-end font-bold border-b border-dotted border-gray-400 pb-1"><span>INDEKS</span><span>...</span></div>
                                                        <div className="flex justify-between items-end font-bold border-b border-dotted border-gray-400 pb-1"><span>PROFIL PENULIS</span><span>...</span></div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {activeTab === 'chapters' && (
                                            <div className="space-y-8">
                                                {bookData.chapters.map((ch, idx) => (
                                                    <div key={idx} className="book-page relative group">
                                                        {/* Tombol Edit Hover */}
                                                        <div className="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity">
                                                            <button 
                                                                onClick={() => handleEditChapter(idx)}
                                                                className="bg-blue-600 text-white px-4 py-2 rounded shadow hover:bg-blue-700 flex items-center gap-2 text-sm font-bold"
                                                            >
                                                                <i className="fas fa-edit"></i> Edit Bab Ini
                                                            </button>
                                                        </div>

                                                        <h2 className="text-3xl font-bold text-center mb-2 uppercase">Bab {idx + 1}</h2>
                                                        <h3 className="text-xl font-medium text-center mb-8 text-gray-700">{ch.title}</h3>
                                                        
                                                        {/* Outline Section */}
                                                        <div className="bg-gray-50 p-4 border-l-4 border-gray-400 mb-8 rounded">
                                                            <h4 className="font-bold text-sm uppercase text-gray-500 mb-2">Struktur Bab:</h4>
                                                            <ul className="list-disc pl-5 text-gray-700 space-y-1">
                                                                {ch.outline.map((o, i) => <li key={i}>{o}</li>)}
                                                            </ul>
                                                        </div>

                                                        {editingChapterIndex === idx ? (
                                                            <div className="bg-blue-50 p-4 rounded-lg border border-blue-200 shadow-inner">
                                                                <div className="flex justify-between mb-2">
                                                                    <span className="font-bold text-blue-800 text-sm">Mode Edit Interaktif</span>
                                                                    <button onClick={() => setShowCitationModal(true)} className="text-sm bg-green-600 text-white px-3 py-1 rounded hover:bg-green-700 shadow flex items-center gap-1">
                                                                        <i className="fas fa-quote-right"></i> Insert Kutipan (Zotero Style)
                                                                    </button>
                                                                </div>
                                                                <textarea
                                                                    ref={textareaRef}
                                                                    value={editContent}
                                                                    onChange={(e) => setEditContent(e.target.value)}
                                                                    className="w-full h-96 p-4 border rounded shadow-inner outline-none focus:ring-2 focus:ring-blue-400 font-serif text-lg leading-relaxed"
                                                                />
                                                                <div className="mt-3 flex justify-end gap-2">
                                                                    <button onClick={() => setEditingChapterIndex(null)} className="px-4 py-2 text-gray-600 hover:bg-gray-200 rounded">Batal</button>
                                                                    <button onClick={handleSaveEdit} className="px-4 py-2 bg-blue-600 text-white font-bold rounded shadow hover:bg-blue-700">Simpan & Auto-Indeks</button>
                                                                </div>
                                                            </div>
                                                        ) : (
                                                            <div className="text-justify leading-relaxed whitespace-pre-wrap text-gray-800 indent-8 font-serif text-lg">
                                                                {ch.content}
                                                            </div>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {activeTab === 'end' && (
                                            <div className="book-page flex flex-col gap-16">
                                                {/* Daftar Pustaka */}
                                                <div>
                                                    <h2 className="text-2xl font-bold text-center mb-8 uppercase tracking-widest border-b-2 border-black pb-4">Daftar Pustaka</h2>
                                                    <div className="space-y-4 pl-4 text-justify" style={{ paddingLeft: '2em', textIndent: '-2em' }}>
                                                        {bookData.bibliography.map((bib, idx) => (
                                                            <p key={idx} className="leading-relaxed">
                                                                {bib.author}. ({bib.year}). <i>{bib.title}</i>.
                                                            </p>
                                                        ))}
                                                    </div>
                                                </div>

                                                {/* Indeks */}
                                                <div style={{ pageBreakBefore: 'always' }}>
                                                    <h2 className="text-2xl font-bold text-center mb-8 uppercase tracking-widest border-b-2 border-black pb-4">Indeks</h2>
                                                    <div className="columns-2 gap-8 text-sm">
                                                        {bookData.index.sort((a,b) => a.keyword.localeCompare(b.keyword)).map((ind, idx) => (
                                                            <div key={idx} className="mb-2">
                                                                <span className="font-bold">{ind.keyword}</span>, <span className="text-gray-600">{[...new Set(ind.chapters)].join(', ')}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>

                                                {/* Biografi */}
                                                <div style={{ pageBreakBefore: 'always' }}>
                                                    <h2 className="text-2xl font-bold text-center mb-8 uppercase tracking-widest border-b-2 border-black pb-4">Profil Penulis</h2>
                                                    <div className="flex gap-6 items-start">
                                                        <div className="w-32 h-40 bg-gray-300 border-4 border-white shadow-lg shrink-0 flex items-center justify-center text-gray-500">
                                                            <i className="fas fa-user text-4xl"></i>
                                                        </div>
                                                        <div className="text-justify leading-relaxed">
                                                            <h3 className="font-bold text-lg mb-2">{authorName}</h3>
                                                            <p>{bookData.author_bio}</p>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>

                    {/* Zotero-style Citation Modal */}
                    {showCitationModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center backdrop-blur-sm">
                            <div className="bg-white p-6 rounded-xl shadow-2xl w-96">
                                <h3 className="font-bold text-lg border-b pb-2 mb-4 flex items-center gap-2">
                                    <i className="fas fa-quote-right text-green-600"></i> Tambah Referensi
                                </h3>
                                <div className="space-y-3">
                                    <div>
                                        <label className="text-sm font-semibold">Nama Penulis</label>
                                        <input type="text" value={citationForm.author} onChange={e=>setCitationForm({...citationForm, author: e.target.value})} placeholder="Misal: Sugiyono" className="w-full p-2 border rounded" />
                                    </div>
                                    <div>
                                        <label className="text-sm font-semibold">Tahun Terbit</label>
                                        <input type="text" value={citationForm.year} onChange={e=>setCitationForm({...citationForm, year: e.target.value})} placeholder="Misal: 2023" className="w-full p-2 border rounded" />
                                    </div>
                                    <div>
                                        <label className="text-sm font-semibold">Judul Buku/Artikel</label>
                                        <input type="text" value={citationForm.title} onChange={e=>setCitationForm({...citationForm, title: e.target.value})} placeholder="Metodologi Penelitian..." className="w-full p-2 border rounded" />
                                    </div>
                                </div>
                                <div className="mt-6 flex justify-end gap-2">
                                    <button onClick={() => setShowCitationModal(false)} className="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded">Batal</button>
                                    <button onClick={insertCitation} className="px-4 py-2 bg-green-600 text-white font-bold rounded shadow hover:bg-green-700">Sisipkan</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Notification */}
                    {toast.show && (
                        <div className={`fixed bottom-4 right-4 px-6 py-3 rounded-lg shadow-xl text-white font-medium flex items-center gap-3 toast-enter z-50 ${toast.type === 'error' ? 'bg-red-500' : toast.type === 'success' ? 'bg-green-500' : 'bg-blue-600'}`}>
                            <i className={`fas ${toast.type === 'error' ? 'fa-exclamation-circle' : toast.type === 'success' ? 'fa-check-circle' : 'fa-info-circle'}`}></i>
                            {toast.message}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
